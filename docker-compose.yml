services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: text_to_sql
      POSTGRES_USER: text_to_sql
      POSTGRES_PASSWORD: text_to_sql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  text-to-sql-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/text_to_sql.db}
      LOG_LEVEL: INFO
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      ENABLE_SEMANTIC_CACHE: ${ENABLE_SEMANTIC_CACHE:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.92}
      SEMANTIC_CACHE_MAX_ENTRIES: ${SEMANTIC_CACHE_MAX_ENTRIES:-200}
    volumes:
      - text_to_sql_data:/app/data
    depends_on:
      - redis
      - postgres
      - mongodb
    restart: unless-stopped

volumes:
  text_to_sql_data:
  redis_data:
  postgres_data:
  mongodb_data:
