services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  text-to-sql-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/text_to_sql.db
      LOG_LEVEL: INFO
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
      ENABLE_SEMANTIC_CACHE: ${ENABLE_SEMANTIC_CACHE:-true}
      SEMANTIC_CACHE_THRESHOLD: ${SEMANTIC_CACHE_THRESHOLD:-0.92}
      SEMANTIC_CACHE_MAX_ENTRIES: ${SEMANTIC_CACHE_MAX_ENTRIES:-200}
    volumes:
      - text_to_sql_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  text_to_sql_data:
  redis_data:
