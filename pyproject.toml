[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "Interview-ready Text-to-SQL agent using FastAPI, LangChain, Mistral, and SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-mistralai>=0.2.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
text-to-sql-api = "text_to_sql_agent.main:run"
text-to-sql-eval = "text_to_sql_agent.evaluation:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent"]
